<body data-page="product">
<a class="skip-link" href="#main">Skip to content</a>

<div class="announce" data-shell="announce" data-zone="dark" role="region" aria-label="Announcement">
  <p data-announcement></p>
  <button type="button" class="announce__close" data-announce-close aria-label="Dismiss announcement"><svg class="icon" width="20" height="20" aria-hidden="true" focusable="false"><use href="assets/img/icons.svg#i-x"/></svg></button>
</div>

<!-- Shell header: shell.js replaces this no-JS fallback with the full capsule (same geometry). -->
<header class="site-header" data-shell="header">
  <div class="capsule glass-chrome">
    <div class="capsule__bar">
      <span></span>
      <a class="capsule__logo plate" href="index.html" aria-label="Home"><svg viewBox="0 0 204 40" width="112" height="22" aria-hidden="true" focusable="false"><use href="assets/img/logo.svg#logo"/></svg></a>
      <nav class="capsule__nav plate" aria-label="Main"><ul>
        <li><a class="capsule__link" href="shop.html">Shop coffee</a></li>
        <li><a class="capsule__link" href="index.html#finder">Find your coffee</a></li>
        <li><a class="capsule__link" href="guides/index.html">Brew guides</a></li>
        <li><a class="capsule__link" href="cafes.html">Cafés</a></li>
        <li><a class="capsule__link" href="about.html">Our story</a></li>
      </ul></nav>
      <a class="capsule__cart plate" href="cart.html" aria-label="Cart"><svg class="icon" width="22" height="22" aria-hidden="true" focusable="false"><use href="assets/img/icons.svg#i-bag"/></svg></a>
    </div>
  </div>
</header>
<noscript><p class="nojs">This shop needs JavaScript for the cart and filters. You can still read the guides and find a café.</p></noscript>

<main id="main" tabindex="-1">
  <div class="pdp" data-pdp aria-busy="true">
    <div class="container pdp__loading">
      <p><a class="link" href="shop.html">‹ All coffee</a></p>
      <p class="pdp__loading-text">Loading coffees…</p>
    </div>
  </div>

</main>

<!-- Shell footer: shell.js replaces this no-JS fallback. -->
<footer class="footer" data-shell="footer" data-zone="dark">
  <div class="container footer__static">
    <nav aria-label="Footer"><ul>
      <li><a href="shop.html">All coffee</a></li>
      <li><a href="guides/index.html">Brew guides</a></li>
      <li><a href="cafes.html">Cafés</a></li>
      <li><a href="about.html">Our story</a></li>
      <li><a href="contact.html">Contact us</a></li>
      <li><a href="cart.html">Cart</a></li>
    </ul></nav>
    <p>Demo store. No real orders or payments.</p>
  </div>
</footer>

<!-- Sticky add bar (T1, < 1024 px, DESIGN §7.13): a direct child of <body>. product.js fills it. -->
<div class="addbar glass-chrome" data-addbar data-dark-watch hidden>
  <span class="lens lens--fixed" aria-hidden="true"><svg><use href="#field" filter="url(#lensBlur)"/></svg></span>
  <p class="addbar__info plate" data-addbar-info></p>
  <button type="button" class="btn addbar__btn lacquer squish" data-addbar-btn>Add to cart</button>
</div>

<!-- Grind size guide (T2 bottom sheet, COPY §4.5) -->
<dialog class="sheet sheet--bottom glass-sheet grind-sheet" id="grind-sheet" aria-labelledby="grind-sheet-title">
  <span class="lens" aria-hidden="true"><svg><use href="#field" filter="url(#lensBlur)"/></svg></span>
  <span class="sheet__handle" aria-hidden="true"></span>
  <div class="sheet__head plate plate--solid">
    <h2 class="sheet__title" id="grind-sheet-title">Grind size guide</h2>
    <button type="button" class="plate--btn plate squish sheet__close" data-sheet-close aria-label="Close grind guide"><svg class="icon" width="24" height="24" aria-hidden="true" focusable="false"><use href="assets/img/icons.svg#i-x"/></svg></button>
  </div>
  <div class="sheet__body" data-grind-guide></div>
  <div class="sheet__toasts"></div>
  <p class="sheet__live visually-hidden" aria-live="polite"></p>
</dialog>

<script type="module" src="assets/js/main.js"></script>
<script type="module" src="assets/js/pages/product.js"></script>
