<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>PITLANE/26 preview</title>
<style>
  /* Lightweight card preview for template galleries: a still of the garage with a slow camera
     drift and a light sweep. No 3D, no scripts, so a page full of these stays light on phones. */
  html, body { margin: 0; height: 100%; background: #07070a; overflow: hidden; }
  .frame { position: absolute; inset: 0; overflow: hidden; }
  .frame img { position: absolute; inset: -4%; width: 108%; height: 108%; object-fit: cover; object-position: 12% 50%;
    animation: drift 14s ease-in-out infinite alternate; }
  .frame::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(100deg, transparent 40%, rgba(255,255,255,.10) 50%, transparent 60%);
    background-size: 300% 100%; animation: sweep 6s ease-in-out infinite; }
  @keyframes drift { from { transform: scale(1) translate3d(0, 0, 0); } to { transform: scale(1.06) translate3d(-1.5%, -1%, 0); } }
  @keyframes sweep { 0%, 55% { background-position: 120% 0; } 100% { background-position: -40% 0; } }
  @media (prefers-reduced-motion: reduce) { .frame img, .frame::after { animation: none; } }
</style>
</head>
<body>
  <div class="frame"><img src="thumb.jpg" alt="PITLANE/26: eleven 2026 F1 cars parked in a hex-lit garage"></div>
</body>
</html>
